<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ARI — Field Note</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0c0f;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #1e2329;
    }

    .back {
      color: #f5a623;
      text-decoration: none;
      font-size: 0.9375rem;
      font-weight: 500;
      padding: 0.5rem;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: #f5a623;
      letter-spacing: 0.06em;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Record */
    #panel-record {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 0 1rem;
    }

    #panel-record.active {
      display: flex;
    }

    .hint {
      font-size: 0.8125rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2rem;
    }

    .mic-wrap {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .mic-ring {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      border: 2px solid #f5a623;
      opacity: 0;
      pointer-events: none;
    }

    .mic-ring.pulse {
      animation: pulse 1.2s ease-out infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(1.55); opacity: 0; }
    }

    #mic-btn {
      position: relative;
      z-index: 1;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #f5a623;
      background: #111418;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    #mic-btn:active,
    #mic-btn.recording {
      background: #e8380d;
      border-color: #e8380d;
      transform: scale(0.96);
    }

    #mic-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #mic-btn svg { pointer-events: none; }

    .mic-label {
      font-size: 1rem;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 0.75rem;
    }

    #status {
      font-size: 0.9375rem;
      color: #6b7280;
      min-height: 1.4em;
      text-align: center;
    }

    #status.recording { color: #e8380d; }
    #status.working   { color: #f5a623; }
    #status.error     { color: #ef4444; }

    /* Transcript */
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }

    .transcript-box {
      background: #111418;
      border: 1px solid #1e2329;
      border-radius: 8px;
      padding: 1.125rem;
      font-size: 0.9375rem;
      line-height: 1.65;
      color: #e8eaed;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 1.25rem;
      min-height: 100px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 0.875rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: #f5a623;
      color: #0a0c0f;
      margin-bottom: 0.75rem;
    }

    .btn-secondary {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #1e2329;
    }

    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      padding: 0.875rem 1rem;
      font-size: 0.875rem;
      color: #fca5a5;
      margin-bottom: 1rem;
      text-align: center;
    }

    .error-banner.visible { display: block; }

    /* Structuring */
    #panel-structuring {
      text-align: center;
      padding: 3rem 0;
    }

    #panel-structuring.active { display: block; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #1e2329;
      border-top-color: #f5a623;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1.25rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .structuring-text {
      color: #9ca3af;
      font-size: 0.9375rem;
    }

    /* Action cards */
    .action-card {
      background: #111418;
      border: 1px solid #1e2329;
      border-radius: 6px;
      padding: 1.25rem 1.25rem 1.25rem 1rem;
      margin-bottom: 1.25rem;
    }

    .action-card-issue  { border-left: 6px solid #ef4444; }
    .action-card-progress { border-left: 6px solid #22c55e; }
    .action-card-rfi    { border-left: 6px solid #f5a623; }

    .action-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .action-title {
      font-size: 1.125rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #e8eaed;
      line-height: 1.2;
    }

    .action-badge {
      flex-shrink: 0;
      font-size: 0.625rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
    }

    .badge-HIGH   { background: rgba(239,68,68,0.25);  color: #f87171; border: 1px solid #ef4444; }
    .badge-MEDIUM { background: rgba(245,158,11,0.25); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-LOW    { background: rgba(34,197,94,0.2);  color: #4ade80; border: 1px solid #22c55e; }

    .action-field {
      margin-bottom: 1rem;
    }

    .action-field:last-child {
      margin-bottom: 0;
    }

    .action-label {
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #6b7280;
      margin-bottom: 0.35rem;
    }

    .action-value {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9375rem;
      line-height: 1.55;
      color: #e8eaed;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <header>
    <a href="/dashboard.html" class="back">← Back</a>
    <div class="logo">ARI</div>
    <span style="width: 60px;"></span>
  </header>

  <main>
    <!-- Record -->
    <section id="panel-record" class="panel active">
      <p class="hint">Voice capture</p>
      <div class="mic-wrap">
        <div class="mic-ring" id="mic-ring"></div>
        <button type="button" id="mic-btn" aria-label="Hold to talk">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="#e8eaed"/>
            <path d="M6 11a6 6 0 0 0 12 0" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="17" x2="12" y2="21" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
            <line x1="9" y1="21" x2="15" y2="21" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <p class="mic-label">Tap to Record</p>
      <p id="status">Ready</p>
    </section>

    <!-- Transcript -->
    <section id="panel-transcript" class="panel">
      <div id="transcript-section">
        <p class="section-label">Transcript</p>
        <div class="transcript-box" id="transcript-text"></div>
      </div>
      <div class="error-banner" id="error-banner"></div>
      <button type="button" class="btn btn-primary" id="structure-btn">Structure Field Note</button>
      <button type="button" class="btn btn-secondary" id="rerecord-btn">Record Again</button>
    </section>

    <!-- Structuring -->
    <section id="panel-structuring" class="panel">
      <div class="spinner"></div>
      <p class="structuring-text">ARI is classifying your note...</p>
    </section>

    <!-- Action result -->
    <section id="panel-action" class="panel">
      <div id="action-card-root"></div>
    </section>
  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login.html';
    }

    const panels = {
      record: document.getElementById('panel-record'),
      transcript: document.getElementById('panel-transcript'),
      structuring: document.getElementById('panel-structuring'),
      action: document.getElementById('panel-action'),
    };

    const micBtn = document.getElementById('mic-btn');
    const micRing = document.getElementById('mic-ring');
    const statusEl = document.getElementById('status');
    const transcriptText = document.getElementById('transcript-text');
    const errorBanner = document.getElementById('error-banner');
    const structureBtn = document.getElementById('structure-btn');
    const rerecordBtn = document.getElementById('rerecord-btn');
    const transcriptSection = document.getElementById('transcript-section');
    const actionCardRoot = document.getElementById('action-card-root');

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let micStream = null;
    const RECORDER_TIMESLICE_MS = 1000; // periodic chunks — required for reliable long recordings

    function showPanel(name) {
      Object.values(panels).forEach((p) => p.classList.remove('active'));
      panels[name].classList.add('active');
    }

    function setStatus(text, className) {
      statusEl.textContent = text;
      statusEl.className = className || '';
    }

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add('visible');
    }

    function hideError() {
      errorBanner.classList.remove('visible');
      errorBanner.textContent = '';
    }

    function esc(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function resetToRecord() {
      hideError();
      transcriptText.textContent = '';
      transcriptSection.style.display = '';
      structureBtn.style.display = '';
      rerecordBtn.style.display = '';
      actionCardRoot.innerHTML = '';
      setStatus('Ready');
      showPanel('record');
    }

    function badgeHtml(level) {
      const p = (level || 'LOW').toUpperCase();
      return `<span class="action-badge badge-${p}">${esc(p)}</span>`;
    }

    function fieldHtml(label, value) {
      const display = value != null && String(value).trim() !== '' ? esc(value) : '—';
      return `<div class="action-field">
        <div class="action-label">${esc(label)}</div>
        <div class="action-value">${display}</div>
      </div>`;
    }

    async function saveNote(type, structured, rawTranscript) {
      try {
        const token = localStorage.getItem('token');
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ type, structured, rawTranscript })
        });
        const data = await res.json();
        console.log('Note saved:', data.id);
      } catch (err) {
        console.warn('Could not save note:', err);
      }
    }

    function renderActionCard(data) {
      let cardClass = 'action-card';
      let title = '';
      let badge = '';
      let fields = '';

      if (data.type === 'issue') {
        cardClass += ' action-card-issue';
        title = '⚠ ISSUE LOGGED';
        badge = badgeHtml(data.priority);
        fields = [
          fieldHtml('Date', data.date),
          fieldHtml('Area', data.area),
          fieldHtml('Description', data.description),
          fieldHtml('Impact', data.impact),
          fieldHtml('Recommended Action', data.recommended_action),
          fieldHtml('Logged By', data.logged_by),
        ].join('');
      } else if (data.type === 'progress') {
        cardClass += ' action-card-progress';
        title = '✓ PROGRESS LOGGED';
        fields = [
          fieldHtml('Date', data.date),
          fieldHtml('Area', data.area),
          fieldHtml('Work Completed', data.work_completed),
          fieldHtml('Crew', data.crew),
          fieldHtml('Notes', data.notes),
          fieldHtml('Logged By', data.logged_by),
        ].join('');
      } else if (data.type === 'rfi') {
        cardClass += ' action-card-rfi';
        title = '? RFI PREPARED';
        badge = badgeHtml(data.urgency);
        fields = [
          fieldHtml('Date', data.date),
          fieldHtml('Subject', data.subject),
          fieldHtml('Question', data.question),
          fieldHtml('Area Affected', data.area_affected),
          fieldHtml('Urgency', data.urgency),
          fieldHtml('Requested By', data.requested_by),
          fieldHtml('Notes', data.notes),
        ].join('');
      } else {
        actionCardRoot.innerHTML = `<div class="error-banner visible">Unknown action type: ${esc(data.type)}</div>`;
        return;
      }

      actionCardRoot.innerHTML = `
        <div class="${cardClass}">
          <div class="action-card-top">
            <h2 class="action-title">${title}</h2>
            ${badge}
          </div>
          ${fields}
        </div>
        <button type="button" class="btn btn-primary" id="record-another-btn">Record Another</button>
      `;

      document.getElementById('record-another-btn').addEventListener('click', resetToRecord);
    }

    async function ensureMic() {
      if (micStream) return micStream;
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      return micStream;
    }

    async function startRecording() {
      if (isRecording) return;
      hideError();
      try {
        const stream = await ensureMic();
        audioChunks = [];
        const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus'
          : MediaRecorder.isTypeSupported('audio/webm')
            ? 'audio/webm'
            : '';
        mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onerror = () => {
          setStatus('Recording error', 'error');
          isRecording = false;
          micBtn.classList.remove('recording');
          micRing.classList.remove('pulse');
        };
        // Timeslice ensures chunks flush during long recordings (not only at stop)
        mediaRecorder.start(RECORDER_TIMESLICE_MS);
        isRecording = true;
        micBtn.classList.add('recording');
        micRing.classList.add('pulse');
        setStatus('Recording... (tap to stop)', 'recording');
      } catch {
        setStatus('Microphone access denied', 'error');
      }
    }

    async function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      isRecording = false;
      micBtn.classList.remove('recording');
      micRing.classList.remove('pulse');
      setStatus('Processing...', 'working');

      const recorder = mediaRecorder;
      await new Promise((resolve) => {
        recorder.addEventListener('stop', () => resolve(), { once: true });
        if (recorder.state === 'recording') {
          try {
            if (typeof recorder.requestData === 'function') recorder.requestData();
          } catch (_) { /* ignore */ }
          recorder.stop();
        } else {
          resolve();
        }
      });

      await transcribeAudio();
    }

    micBtn.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    async function transcribeAudio() {
      const blob = new Blob(audioChunks, { type: mediaRecorder?.mimeType || 'audio/webm' });
      console.log('Audio blob:', blob.size, 'bytes, chunks:', audioChunks.length);
      if (!blob.size) {
        showPanel('transcript');
        showError('No audio captured. Try recording again.');
        setStatus('Ready');
        return;
      }
      const ext = (mediaRecorder?.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const formData = new FormData();
      formData.append('audio', blob, `recording.${ext}`);

      try {
        const res = await fetch('/api/transcribe', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token },
          body: formData,
        });
        const data = await res.json();
        if (!res.ok || !data.transcript) {
          throw new Error(data.error || 'Transcription failed');
        }
        transcriptText.textContent = data.transcript;
        hideError();
        setStatus('Ready');
        showPanel('transcript');
      } catch (err) {
        transcriptText.textContent = '';
        showPanel('transcript');
        showError(err.message || 'Transcription failed');
        setStatus('Ready');
      }
    }

    structureBtn.addEventListener('click', async () => {
      const transcript = transcriptText.textContent.trim();
      if (!transcript) return;

      hideError();
      structureBtn.disabled = true;
      showPanel('structuring');

      try {
        const res = await fetch('/api/structure-action', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token,
          },
          body: JSON.stringify({ transcript }),
        });

        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.error || 'Structuring failed');
        }

        renderActionCard(data);
        showPanel('action');
        saveNote(data.type, data, transcript);
      } catch (err) {
        showPanel('transcript');
        showError(err.message || 'Could not structure note');
      } finally {
        structureBtn.disabled = false;
      }
    });

    rerecordBtn.addEventListener('click', resetToRecord);
  </script>
</body>
</html>
