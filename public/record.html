<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BLDR — Daily Log</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f97316;
      letter-spacing: 0.05em;
    }

    .back-link {
      color: #f97316;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.5rem;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .record-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 2rem 0;
    }

    .talk-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: #f97316;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
      box-shadow: 0 8px 32px rgba(249, 115, 22, 0.35);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .talk-btn:active,
    .talk-btn.recording {
      transform: scale(1.08);
      background: #ea580c;
      box-shadow: 0 8px 40px rgba(249, 115, 22, 0.55);
    }

    .talk-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .talk-btn svg {
      width: 56px;
      height: 56px;
      fill: #fff;
    }

    .talk-label {
      margin-top: 1.25rem;
      font-size: 1.125rem;
      font-weight: 600;
      color: #ccc;
    }

    .status {
      margin-top: 1.5rem;
      font-size: 1rem;
      color: #888;
      min-height: 1.5rem;
      text-align: center;
    }

    .status.recording { color: #f97316; }
    .status.processing { color: #fbbf24; }
    .status.done { color: #4ade80; }
    .status.error { color: #f87171; }

    .transcript-area {
      width: 100%;
      margin-top: 2rem;
      display: none;
    }

    .transcript-area.visible {
      display: block;
    }

    .transcript-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .transcript-box {
      background: #262626;
      border: 1px solid #404040;
      border-radius: 12px;
      padding: 1.25rem;
      font-size: 1rem;
      line-height: 1.6;
      color: #e5e5e5;
      min-height: 120px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .new-recording-btn {
      display: none;
      width: 100%;
      margin-top: 1.5rem;
      padding: 1rem;
      background: transparent;
      color: #f97316;
      border: 2px solid #f97316;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 52px;
      transition: background 0.2s, color 0.2s;
    }

    .new-recording-btn.visible {
      display: block;
    }

    .new-recording-btn:hover {
      background: #f97316;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <a href="/dashboard.html" class="back-link">← Back</a>
    <div class="logo">BLDR</div>
  </header>

  <main>
    <div class="record-section" id="recordSection">
      <button type="button" class="talk-btn" id="talkBtn" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.09-.6-.39-1.14-1-1.14z"/>
        </svg>
      </button>
      <p class="talk-label">Hold to Talk</p>
      <p class="status" id="status">Ready</p>
    </div>

    <div class="transcript-area" id="transcriptArea">
      <p class="transcript-label">Transcript</p>
      <div class="transcript-box" id="transcriptBox"></div>
      <button type="button" class="new-recording-btn" id="newRecordingBtn">Start New Recording</button>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login.html';
    }

    const talkBtn = document.getElementById('talkBtn');
    const statusEl = document.getElementById('status');
    const recordSection = document.getElementById('recordSection');
    const transcriptArea = document.getElementById('transcriptArea');
    const transcriptBox = document.getElementById('transcriptBox');
    const newRecordingBtn = document.getElementById('newRecordingBtn');

    let mediaRecorder = null;
    let audioChunks = [];
    let stream = null;
    let isRecording = false;

    function setStatus(text, className = '') {
      statusEl.textContent = text;
      statusEl.className = 'status' + (className ? ' ' + className : '');
    }

    async function initMic() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        setStatus('Microphone access denied', 'error');
        talkBtn.disabled = true;
      }
    }

    function startRecording() {
      if (!stream || isRecording) return;

      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.start();
      isRecording = true;
      talkBtn.classList.add('recording');
      setStatus('Recording...', 'recording');
    }

    async function stopRecording() {
      if (!isRecording || !mediaRecorder) return;

      isRecording = false;
      talkBtn.classList.remove('recording');

      const recorder = mediaRecorder;
      const done = new Promise((resolve) => {
        recorder.onstop = resolve;
      });

      recorder.stop();
      await done;

      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      await transcribe(blob);
    }

    async function transcribe(blob) {
      setStatus('Processing...', 'processing');
      talkBtn.disabled = true;

      const formData = new FormData();
      formData.append('audio', blob, 'audio.webm');

      try {
        const res = await fetch('/api/transcribe', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token },
          body: formData,
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus(data.error || 'Transcription failed', 'error');
          talkBtn.disabled = false;
          return;
        }

        transcriptBox.textContent = data.transcript;
        transcriptArea.classList.add('visible');
        newRecordingBtn.classList.add('visible');
        recordSection.style.display = 'none';
        setStatus('Done', 'done');
      } catch {
        setStatus('Unable to connect. Please try again.', 'error');
        talkBtn.disabled = false;
      }
    }

    function resetRecording() {
      transcriptArea.classList.remove('visible');
      newRecordingBtn.classList.remove('visible');
      transcriptBox.textContent = '';
      recordSection.style.display = '';
      talkBtn.disabled = false;
      setStatus('Ready');
    }

    talkBtn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      startRecording();
    });
    talkBtn.addEventListener('mouseup', stopRecording);
    talkBtn.addEventListener('mouseleave', () => {
      if (isRecording) stopRecording();
    });

    talkBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startRecording();
    }, { passive: false });
    talkBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      stopRecording();
    });
    talkBtn.addEventListener('touchcancel', stopRecording);

    newRecordingBtn.addEventListener('click', resetRecording);

    initMic();
  </script>
</body>
</html>
