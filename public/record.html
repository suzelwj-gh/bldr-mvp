<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BLDR — Daily Log</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0c0f;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #1e2329;
    }

    .back {
      color: #f5a623;
      text-decoration: none;
      font-size: 0.9375rem;
      font-weight: 500;
      padding: 0.5rem;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: #f5a623;
      letter-spacing: 0.06em;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Record */
    #panel-record {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 0 1rem;
    }

    #panel-record.active {
      display: flex;
    }

    .hint {
      font-size: 0.8125rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2rem;
    }

    .mic-wrap {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .mic-ring {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      border: 2px solid #f5a623;
      opacity: 0;
      pointer-events: none;
    }

    .mic-ring.pulse {
      animation: pulse 1.2s ease-out infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(1.55); opacity: 0; }
    }

    #mic-btn {
      position: relative;
      z-index: 1;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #f5a623;
      background: #111418;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    #mic-btn:active,
    #mic-btn.recording {
      background: #e8380d;
      border-color: #e8380d;
      transform: scale(0.96);
    }

    #mic-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #mic-btn svg { pointer-events: none; }

    .mic-label {
      font-size: 1rem;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 0.75rem;
    }

    #status {
      font-size: 0.9375rem;
      color: #6b7280;
      min-height: 1.4em;
      text-align: center;
    }

    #status.recording { color: #e8380d; }
    #status.working   { color: #f5a623; }
    #status.error     { color: #ef4444; }

    /* Transcript */
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }

    .transcript-box {
      background: #111418;
      border: 1px solid #1e2329;
      border-radius: 8px;
      padding: 1.125rem;
      font-size: 0.9375rem;
      line-height: 1.65;
      color: #e8eaed;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 1.25rem;
      min-height: 100px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 0.875rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: #f5a623;
      color: #0a0c0f;
      margin-bottom: 0.75rem;
    }

    .btn-secondary {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #1e2329;
    }

    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      padding: 0.875rem 1rem;
      font-size: 0.875rem;
      color: #fca5a5;
      margin-bottom: 1rem;
      text-align: center;
    }

    .error-banner.visible { display: block; }

    /* Structuring */
    #panel-structuring {
      text-align: center;
      padding: 3rem 0;
    }

    #panel-structuring.active { display: block; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #1e2329;
      border-top-color: #f5a623;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1.25rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .structuring-text {
      color: #9ca3af;
      font-size: 0.9375rem;
    }

    /* Daily log */
    .log-header {
      margin-bottom: 1.5rem;
    }

    .log-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #e8eaed;
      line-height: 1.2;
      margin-bottom: 0.25rem;
    }

    .log-header .log-date {
      font-size: 0.875rem;
      color: #6b7280;
    }

    .log-card {
      background: #111418;
      border: 1px solid #1e2329;
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .log-card-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b7280;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1e2329;
      background: #0d1014;
    }

    .log-card-body {
      padding: 1rem;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .meta-item label {
      display: block;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-bottom: 0.25rem;
    }

    .meta-item span {
      font-size: 0.9375rem;
      color: #e8eaed;
    }

    .empty {
      font-size: 0.875rem;
      color: #6b7280;
      font-style: italic;
    }

    .work-item {
      padding: 0.75rem 0;
      border-bottom: 1px solid #1e2329;
    }

    .work-item:last-child { border-bottom: none; padding-bottom: 0; }
    .work-item:first-child { padding-top: 0; }

    .work-area {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #f5a623;
      margin-bottom: 0.25rem;
    }

    .work-desc {
      font-size: 0.9375rem;
      line-height: 1.5;
      color: #e8eaed;
    }

    .issue-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      padding: 0.75rem 0;
      border-bottom: 1px solid #1e2329;
    }

    .issue-row:last-child { border-bottom: none; padding-bottom: 0; }
    .issue-row:first-child { padding-top: 0; }

    .priority {
      flex-shrink: 0;
      font-size: 0.625rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
    }

    .priority-HIGH   { background: rgba(239,68,68,0.2);  color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
    .priority-MEDIUM { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
    .priority-LOW    { background: rgba(107,114,128,0.25); color: #9ca3af; border: 1px solid rgba(107,114,128,0.35); }

    .issue-desc {
      font-size: 0.9375rem;
      line-height: 1.5;
      color: #e8eaed;
    }

    .steps-list {
      list-style: none;
    }

    .steps-list li {
      position: relative;
      padding: 0.5rem 0 0.5rem 1.25rem;
      font-size: 0.9375rem;
      line-height: 1.5;
      border-bottom: 1px solid #1e2329;
    }

    .steps-list li:last-child { border-bottom: none; }

    .steps-list li::before {
      content: '›';
      position: absolute;
      left: 0;
      color: #f5a623;
      font-weight: 700;
    }

    .raw-notes {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #d1d5db;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <a href="/dashboard.html" class="back">← Back</a>
    <div class="logo">BLDR</div>
    <span style="width: 60px;"></span>
  </header>

  <main>
    <!-- Record -->
    <section id="panel-record" class="panel active">
      <p class="hint">Voice capture</p>
      <div class="mic-wrap">
        <div class="mic-ring" id="mic-ring"></div>
        <button type="button" id="mic-btn" aria-label="Hold to talk">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="#e8eaed"/>
            <path d="M6 11a6 6 0 0 0 12 0" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="17" x2="12" y2="21" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
            <line x1="9" y1="21" x2="15" y2="21" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <p class="mic-label">Tap to Record</p>
      <p id="status">Ready</p>
    </section>

    <!-- Transcript -->
    <section id="panel-transcript" class="panel">
      <p class="section-label">Transcript</p>
      <div class="error-banner" id="error-banner"></div>
      <div class="transcript-box" id="transcript-text"></div>
      <button type="button" class="btn btn-primary" id="structure-btn">Structure into Daily Log</button>
      <button type="button" class="btn btn-secondary" id="rerecord-btn">Record Again</button>
    </section>

    <!-- Structuring -->
    <section id="panel-structuring" class="panel">
      <div class="spinner"></div>
      <p class="structuring-text">Structuring your daily log…</p>
    </section>

    <!-- Daily log -->
    <section id="panel-log" class="panel">
      <div class="log-header">
        <h1 id="log-project">Daily Field Log</h1>
        <p class="log-date" id="log-date"></p>
      </div>

      <div class="log-card">
        <div class="log-card-title">Overview</div>
        <div class="log-card-body">
          <div class="meta-grid">
            <div class="meta-item">
              <label>Weather</label>
              <span id="log-weather">—</span>
            </div>
            <div class="meta-item">
              <label>Crew</label>
              <span id="log-crew">—</span>
            </div>
          </div>
        </div>
      </div>

      <div class="log-card">
        <div class="log-card-title">Work Completed</div>
        <div class="log-card-body" id="log-work"></div>
      </div>

      <div class="log-card">
        <div class="log-card-title">Issues</div>
        <div class="log-card-body" id="log-issues"></div>
      </div>

      <div class="log-card">
        <div class="log-card-title">Next Steps</div>
        <div class="log-card-body" id="log-next"></div>
      </div>

      <div class="log-card" id="card-raw-notes" style="display:none;">
        <div class="log-card-title">Additional Notes</div>
        <div class="log-card-body">
          <p class="raw-notes" id="log-raw-notes"></p>
        </div>
      </div>

      <button type="button" class="btn btn-primary" id="new-log-btn" style="margin-top:0.5rem;">New Recording</button>
    </section>
  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login.html';
    }

    const panels = {
      record: document.getElementById('panel-record'),
      transcript: document.getElementById('panel-transcript'),
      structuring: document.getElementById('panel-structuring'),
      log: document.getElementById('panel-log'),
    };

    const micBtn = document.getElementById('mic-btn');
    const micRing = document.getElementById('mic-ring');
    const statusEl = document.getElementById('status');
    const transcriptText = document.getElementById('transcript-text');
    const errorBanner = document.getElementById('error-banner');
    const structureBtn = document.getElementById('structure-btn');
    const rerecordBtn = document.getElementById('rerecord-btn');
    const newLogBtn = document.getElementById('new-log-btn');

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let micStream = null;

    function showPanel(name) {
      Object.values(panels).forEach((p) => p.classList.remove('active'));
      panels[name].classList.add('active');
    }

    function setStatus(text, className) {
      statusEl.textContent = text;
      statusEl.className = className || '';
    }

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add('visible');
    }

    function hideError() {
      errorBanner.classList.remove('visible');
      errorBanner.textContent = '';
    }

    function esc(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmt(value) {
      if (value == null || value === '') return '<span class="empty">Not noted</span>';
      return esc(value);
    }

    async function ensureMic() {
      if (micStream) return micStream;
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      return micStream;
    }

    async function startRecording() {
      if (isRecording) return;
      hideError();
      try {
        const stream = await ensureMic();
        audioChunks = [];
        const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus'
          : MediaRecorder.isTypeSupported('audio/webm')
            ? 'audio/webm'
            : '';
        mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = () => transcribeAudio();
        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add('recording');
        micRing.classList.add('pulse');
        setStatus('Recording... (tap to stop)', 'recording');
      } catch {
        setStatus('Microphone access denied', 'error');
      }
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      isRecording = false;
      micBtn.classList.remove('recording');
      micRing.classList.remove('pulse');
      setStatus('Processing...', 'working');
      mediaRecorder.stop();
    }

    micBtn.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    async function transcribeAudio() {
      const blob = new Blob(audioChunks, { type: mediaRecorder?.mimeType || 'audio/webm' });
      const ext = (mediaRecorder?.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const formData = new FormData();
      formData.append('audio', blob, `recording.${ext}`);

      try {
        const res = await fetch('/api/transcribe', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token },
          body: formData,
        });
        const data = await res.json();
        if (!res.ok || !data.transcript) {
          throw new Error(data.error || 'Transcription failed');
        }
        transcriptText.textContent = data.transcript;
        hideError();
        setStatus('Ready');
        showPanel('transcript');
      } catch (err) {
        transcriptText.textContent = '';
        showPanel('transcript');
        showError(err.message || 'Transcription failed');
        setStatus('Ready');
      }
    }

    structureBtn.addEventListener('click', async () => {
      const transcript = transcriptText.textContent.trim();
      if (!transcript) return;

      hideError();
      structureBtn.disabled = true;
      showPanel('structuring');

      try {
        const res = await fetch('/api/structure-transcript', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token,
          },
          body: JSON.stringify({ transcript }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Structuring failed');
        }

        const log = data.log || data;
        renderLog(log);
        showPanel('log');
      } catch (err) {
        showPanel('transcript');
        showError(err.message || 'Could not structure log');
      } finally {
        structureBtn.disabled = false;
      }
    });

    function renderLog(log) {
      document.getElementById('log-project').textContent = log.project || 'Daily Field Log';
      document.getElementById('log-date').textContent = log.date || '';
      document.getElementById('log-weather').innerHTML = fmt(log.weather);
      document.getElementById('log-crew').innerHTML = fmt(log.crew_count);

      const workEl = document.getElementById('log-work');
      const work = Array.isArray(log.work_completed) ? log.work_completed : [];
      if (work.length === 0) {
        workEl.innerHTML = '<p class="empty">No work items noted</p>';
      } else {
        workEl.innerHTML = work.map((item) => {
          if (typeof item === 'string') {
            return `<div class="work-item"><div class="work-desc">${esc(item)}</div></div>`;
          }
          const area = item.area ? `<div class="work-area">${esc(item.area)}</div>` : '';
          return `<div class="work-item">${area}<div class="work-desc">${esc(item.description)}</div></div>`;
        }).join('');
      }

      const issuesEl = document.getElementById('log-issues');
      const issues = Array.isArray(log.issues) ? log.issues : [];
      if (issues.length === 0) {
        issuesEl.innerHTML = '<p class="empty">No issues logged</p>';
      } else {
        const order = { HIGH: 0, MEDIUM: 1, LOW: 2 };
        const sorted = [...issues].sort(
          (a, b) => (order[a.priority] ?? 3) - (order[b.priority] ?? 3)
        );
        issuesEl.innerHTML = sorted.map((item) => {
          const pri = (item.priority || 'LOW').toUpperCase();
          return `<div class="issue-row">
            <span class="priority priority-${pri}">${esc(pri)}</span>
            <span class="issue-desc">${esc(item.description || item)}</span>
          </div>`;
        }).join('');
      }

      const nextEl = document.getElementById('log-next');
      const steps = Array.isArray(log.next_steps) ? log.next_steps : [];
      if (steps.length === 0) {
        nextEl.innerHTML = '<p class="empty">No follow-up items noted</p>';
      } else {
        nextEl.innerHTML = `<ul class="steps-list">${steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>`;
      }

      const rawCard = document.getElementById('card-raw-notes');
      const rawNotes = log.raw_notes && String(log.raw_notes).trim();
      if (rawNotes) {
        document.getElementById('log-raw-notes').textContent = rawNotes;
        rawCard.style.display = 'block';
      } else {
        rawCard.style.display = 'none';
      }
    }

    rerecordBtn.addEventListener('click', () => {
      hideError();
      transcriptText.textContent = '';
      setStatus('Ready');
      showPanel('record');
    });

    newLogBtn.addEventListener('click', () => {
      hideError();
      transcriptText.textContent = '';
      setStatus('Ready');
      showPanel('record');
    });
  </script>
</body>
</html>
