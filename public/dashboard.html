<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLDR — Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0c0f;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #1e2329;
      background: #111418;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f5a623;
      letter-spacing: 0.06em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logged-in {
      font-size: 0.875rem;
      color: #9ca3af;
    }

    .logged-in strong {
      color: #e8eaed;
    }

    #logoutBtn {
      padding: 0.5rem 1rem;
      background: transparent;
      color: #f5a623;
      border: 1px solid #f5a623;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #logoutBtn:hover {
      background: #f5a623;
      color: #0a0c0f;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #e8eaed;
      margin-bottom: 2rem;
      max-width: 400px;
      line-height: 1.3;
    }

    .record-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      min-height: 64px;
      padding: 1.25rem 2rem;
      background: #f5a623;
      color: #0a0c0f;
      border: none;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 1rem;
    }

    .record-btn:hover {
      background: #e09510;
      color: #0a0c0f;
    }

    .record-btn:active {
      transform: scale(0.98);
    }

    .wrapup-btn { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 360px; min-height: 64px; padding: 1.25rem 2rem; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 1.25rem; font-weight: 800; cursor: pointer; transition: background 0.2s; margin-bottom: 1rem; } .wrapup-btn:hover { background: #1d4ed8; } .log-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      max-width: 360px;
      min-height: 64px;
      padding: 1.25rem 2rem;
      background: transparent;
      color: #9ca3af;
      border: 2px solid #3d4450;
      border-radius: 10px;
      font-size: 1.125rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
      margin-bottom: 1.25rem;
    }

    .log-btn:hover {
      background: #111418;
      border-color: #6b7280;
      color: #e8eaed;
    }

    .log-btn:active {
      transform: scale(0.98);
    }

    .subtitle {
      font-size: 0.9375rem;
      color: #6b7280;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">BLDR</div>
    <div class="header-right">
      <p class="logged-in">Logged in as: <strong id="userName">—</strong></p>
      <button type="button" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main>
    <h1>What do you need to do?</h1>
    <a href="/record.html" class="record-btn">🎙 Record Field Note</a>
    <button id="wrapUpBtn" class="wrapup-btn">📄 Wrap Up My Day</button><a href="/log.html" class="log-btn">📋 Today's Log</a>
    <p class="subtitle">Speak naturally — BLDR will figure out the rest</p>
  </main>

  <script>
    const token = localStorage.getItem('token');

    if (!token) {
      window.location.href = '/login.html';
    }

    const name = localStorage.getItem('name') || 'User';
    document.getElementById('userName').textContent = name;

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function todayParts() {
      const now = new Date();
      const date = now.toISOString().slice(0, 10);
      const day = now.toLocaleDateString('en-US', { weekday: 'long' });
      return { date, day };
    }

    function buildDailyReportBody(notes) {
      const { date, day } = todayParts();
      const progressNotes = notes.filter((note) => note.type === 'progress').map((note) => note.structured || {});
      const issueNotes = notes.filter((note) => note.type === 'issue').map((note) => note.structured || {});
      const rfiNotes = notes.filter((note) => note.type === 'rfi').map((note) => note.structured || {});
      const crews = [...new Set(progressNotes.map((note) => note.crew).filter(Boolean))];

      return {
        project_name: localStorage.getItem('project') || '',
        job_number: '',
        superintendent: localStorage.getItem('name') || 'Superintendent',
        date,
        day,
        project_address: '',
        temp_am: '',
        temp_pm: '',
        weather_clear: '',
        weather_cloudy: '',
        weather_rain: '',
        weather_wind: '',
        weather_other: '',
        rain_am: '',
        rain_pm: '',
        site_conditions: '',
        logistical_changes: '',
        general_notes: notes.map((note) => note.rawTranscript).filter(Boolean).join('\n\n'),
        work_accomplished: progressNotes.map((note) => `${note.area || 'Area not specified'}: ${note.work_completed || note.notes || ''}`).join('\n'),
        work_started: '',
        issues_encountered: issueNotes.map((note) => `${note.area || 'Area not specified'}: ${note.description || ''}${note.impact ? ` Impact: ${note.impact}` : ''}${note.recommended_action ? ` Recommended action: ${note.recommended_action}` : ''}`).join('\n'),
        trade_contractors: crews,
        tier2_contractors: [],
        temp_laborers: [],
        visitors: [],
        equipment: [],
        deliveries: [],
        safety_issues: issueNotes.filter((note) => /safety|hazard|injury|danger/i.test(`${note.description || ''} ${note.impact || ''}`)).map((note) => note.description).join('\n'),
        material_issues: issueNotes.filter((note) => /material|delivery|shortage|supply/i.test(`${note.description || ''} ${note.impact || ''}`)).map((note) => note.description).join('\n'),
        rfi_design_issues: rfiNotes.map((note) => `${note.subject || 'RFI'}: ${note.question || ''}`).join('\n'),
        tm_work: [],
        progress_photos: [],
        completed_by: localStorage.getItem('name') || 'Superintendent',
        title: 'Superintendent',
        completed_date: date
      };
    }

    document.getElementById('wrapUpBtn').addEventListener('click', async () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      const btn = document.getElementById('wrapUpBtn');
      btn.textContent = 'Generating...';
      btn.disabled = true;

      try {
        const notesRes = await fetch('/api/notes/today', {
          headers: { Authorization: 'Bearer ' + token }
        });
        const notesData = await notesRes.json();
        if (!notesRes.ok) throw new Error(notesData.error || 'Failed to fetch notes.');

        const notes = notesData.notes || [];
        const reportBody = buildDailyReportBody(notes);
        const docxRes = await fetch('/api/documents/daily-report', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify(reportBody)
        });
        if (!docxRes.ok) {
          const err = await docxRes.json();
          throw new Error(err.error || 'Failed to generate DOCX.');
        }
        const docxBlob = await docxRes.blob();
        downloadBlob(docxBlob, `daily-report-${reportBody.date}.docx`);

        const pdfRes = await fetch('/api/report/daily', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!pdfRes.ok) {
          const err = await pdfRes.json();
          throw new Error(err.error || 'Failed to generate PDF.');
        }
        const pdfBlob = await pdfRes.blob();
        downloadBlob(pdfBlob, 'BLDR_Report.pdf');
        alert('DOCX and PDF reports downloaded.');
      } catch (err) {
        alert(err.message || 'Error');
      } finally {
        btn.textContent = '📄 Wrap Up My Day';
        btn.disabled = false;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('name');
      localStorage.removeItem('role');
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
