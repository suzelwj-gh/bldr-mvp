<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLDR — Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0c0f;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #1e2329;
      background: #111418;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f5a623;
      letter-spacing: 0.06em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logged-in {
      font-size: 0.875rem;
      color: #9ca3af;
    }

    .logged-in strong {
      color: #e8eaed;
    }

    #logoutBtn {
      padding: 0.5rem 1rem;
      background: transparent;
      color: #f5a623;
      border: 1px solid #f5a623;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #logoutBtn:hover {
      background: #f5a623;
      color: #0a0c0f;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #e8eaed;
      margin-bottom: 2rem;
      max-width: 400px;
      line-height: 1.3;
    }

    .record-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      min-height: 64px;
      padding: 1.25rem 2rem;
      background: #f5a623;
      color: #0a0c0f;
      border: none;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 1rem;
    }

    .record-btn:hover {
      background: #e09510;
      color: #0a0c0f;
    }

    .record-btn:active {
      transform: scale(0.98);
    }

    .log-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      max-width: 360px;
      min-height: 64px;
      padding: 1.25rem 2rem;
      background: transparent;
      color: #9ca3af;
      border: 2px solid #3d4450;
      border-radius: 10px;
      font-size: 1.125rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
      margin-bottom: 1.25rem;
    }

    .log-btn:hover {
      background: #111418;
      border-color: #6b7280;
      color: #e8eaed;
    }

    .log-btn:active {
      transform: scale(0.98);
    }

    .subtitle {
      font-size: 0.9375rem;
      color: #6b7280;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">BLDR</div>
    <div class="header-right">
      <p class="logged-in">Logged in as: <strong id="userName">—</strong></p>
      <button type="button" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main>
    <h1>What do you need to do?</h1>
    <a href="/record.html" class="record-btn">🎙 Record Field Note</a>
    <a href="/log.html" class="log-btn">📋 Today's Log</a>
    <p class="subtitle">Speak naturally — BLDR will figure out the rest</p>
  </main>

  <script>
    const token = localStorage.getItem('token');

    if (!token) {
      window.location.href = '/login.html';
    }

    const name = localStorage.getItem('name') || 'User';
    document.getElementById('userName').textContent = name;

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('name');
      localStorage.removeItem('role');
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
